<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hebrew Word Builder</title>
<style>
  :root {
    --bg: #f6f1e6;
    --card-bg: #fffdf8;
    --ink: #2b2420;
    --ink-soft: #6b5f52;
    --border: #e3d7c0;
    --accent: #1e3a5f;
    --accent-light: #2d5580;
    --gold: #b8860b;
    --gold-soft: #f3e6c8;
    --good: #2f7a4f;
    --good-bg: #e6f4ea;
    --bad: #b3261e;
    --bad-bg: #fbe9e7;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 2rem 1rem;
  }

  .shell {
    max-width: 880px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(43, 36, 32, 0.08);
    padding: 2rem 2rem 2.5rem;
  }

  header { text-align: center; margin-bottom: 0.5rem; }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.3rem;
    letter-spacing: 0.02em;
  }
  header .subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0;
  }
  header .rule {
    width: 60px;
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
    margin: 0.9rem auto 1.6rem;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 1.8rem;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .layout { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; }
  .flashcard, .assembly { flex: 1 1 320px; }

  .flashcard-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    box-shadow: 0 4px 14px rgba(43, 36, 32, 0.06);
  }
  .flashcard-card img {
    width: 100%;
    display: block;
    border-radius: 10px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: #faf7f0;
  }

  .assembled {
    direction: rtl;
    unicode-bidi: bidi-override;
    font-family: "Times New Roman", Times, serif;
    font-size: 3rem;
    letter-spacing: 0.3rem;
    text-align: center;
    border: 2px solid var(--gold-soft);
    background: #fffefb;
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1.2rem;
    min-height: 4.5rem;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .assembled.is-correct {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .assembled.is-wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .bank {
    display: flex;
    flex-wrap: wrap;
    direction: rtl;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.2rem;
    padding: 0.9rem;
    background: #faf7ef;
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .bank button {
    font-family: "Times New Roman", Times, serif;
    font-size: 1.6rem;
    width: 2.6rem;
    height: 2.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--border);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }
  .bank button:hover:not(:disabled) {
    background: var(--gold-soft);
  }
  .bank button:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 0 0 var(--border);
  }
  .bank button:disabled {
    opacity: 0.35;
    cursor: default;
    box-shadow: none;
  }

  .controls { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
  .controls button {
    flex: 1;
    padding: 0.65rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
    color: var(--ink);
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .controls button:hover:not(:disabled) { background: var(--gold-soft); }
  .controls button:disabled { opacity: 0.45; cursor: default; }

  .feedback {
    padding: 1rem 1.1rem;
    border-radius: 12px;
    margin-bottom: 0;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .feedback.show { opacity: 1; transform: translateY(0); }
  .feedback.correct { background: var(--good-bg); color: var(--good); }
  .feedback.wrong { background: var(--bad-bg); color: var(--bad); }
  .feedback p { margin: 0 0 0.6rem; font-size: 1rem; }
  .feedback button {
    background: white;
    border: 1px solid currentColor;
    color: inherit;
    width: 100%;
    padding: 0.55rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
  }

  @media (max-width: 640px) {
    .shell { padding: 1.4rem 1.1rem 1.8rem; }
    .assembled { font-size: 2.2rem; }
    .bank button { width: 2.3rem; height: 2.3rem; font-size: 1.35rem; }
  }
</style>
</head>
<body>

<div class="shell">
  <header>
    <h1>Hebrew Word Builder</h1>
    <p class="subtitle">Tap the letters, right to left, to spell the word shown.</p>
    <div class="rule"></div>
  </header>

  <div class="progress-row">
    <span id="progress-text">Card 1 of 1</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
  </div>

  <div class="layout">
    <div class="flashcard">
      <div class="flashcard-card">
        <img id="flashcard-img" src="" alt="flashcard">
      </div>
    </div>

    <div class="assembly">
      <div class="assembled" id="assembled"></div>
      <div class="bank" id="bank"></div>
      <div class="controls">
        <button id="undo-btn">↩ Undo</button>
        <button id="reset-btn">🔄 Reset word</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
</div>

<script>
// ---------- Config ----------
// Fixed aleph-bet order, sofit forms placed right after their base letter.
// This is a persistent keyboard: keys are never removed or shuffled, so
// words with a repeated letter (e.g. two lameds) work with no special
// handling — the student just presses that key twice. The .bank container
// has direction: rtl, so this array's order renders aleph top-right,
// wrapping right-to-left row by row, like a real Hebrew keyboard.
const FULL_ALPHABET = [
  "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט", "י",
  "כ", "ך", "ל", "מ", "ם", "נ", "ן", "ס", "ע",
  "פ", "ף", "צ", "ץ", "ק", "ר", "ש", "ת"
];

// ---------- State ----------
let WORDS = [];
let wordIndex = 0;
let assembled = [];
let status = null; // null | "correct" | "wrong"

function newRound(index) {
  wordIndex = index;
  assembled = [];
  status = null;
  render();
}

// ---------- Rendering ----------
function render() {
  const word = WORDS[wordIndex];

  document.getElementById("flashcard-img").src = word.image;
  document.getElementById("flashcard-img").alt = word.id;

  // Progress
  document.getElementById("progress-text").textContent =
    `Card ${wordIndex + 1} of ${WORDS.length}`;
  document.getElementById("progress-fill").style.width =
    `${((wordIndex + 1) / WORDS.length) * 100}%`;

  // Assembled slots (right-to-left)
  const slots = [...assembled];
  while (slots.length < word.letters.length) slots.push("_");
  const assembledEl = document.getElementById("assembled");
  assembledEl.textContent = slots.join(" ");
  assembledEl.className = "assembled" +
    (status === "correct" ? " is-correct" : status === "wrong" ? " is-wrong" : "");

  // Letter keyboard — fixed aleph-bet order, always all 27 keys,
  // never removed or reordered, so duplicate letters just work.
  const isFull = assembled.length >= word.letters.length;
  const bank = document.getElementById("bank");
  bank.innerHTML = "";
  FULL_ALPHABET.forEach(letter => {
    const btn = document.createElement("button");
    btn.textContent = letter;
    btn.disabled = status === "correct" || isFull;
    btn.onclick = () => {
      assembled.push(letter);
      if (assembled.length === word.letters.length) {
        status = arraysEqual(assembled, word.letters) ? "correct" : "wrong";
      }
      render();
    };
    bank.appendChild(btn);
  });

  // Undo / reset
  document.getElementById("undo-btn").disabled = assembled.length === 0;

  // Feedback
  const feedback = document.getElementById("feedback");
  feedback.innerHTML = "";
  if (status === "correct") {
    feedback.className = "feedback correct show";
    feedback.innerHTML =
      `<p>✅ Correct! <strong>${word.translit}</strong> — ${word.gloss}</p>`;
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next card ▶";
    nextBtn.onclick = () => newRound((wordIndex + 1) % WORDS.length);
    feedback.appendChild(nextBtn);
  } else if (status === "wrong") {
    feedback.className = "feedback wrong show";
    feedback.innerHTML = `<p>❌ Not quite — try again.</p>`;
    const retryBtn = document.createElement("button");
    retryBtn.textContent = "Try again";
    retryBtn.onclick = () => newRound(wordIndex);
    feedback.appendChild(retryBtn);
  } else {
    feedback.className = "feedback";
  }
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

document.getElementById("undo-btn").onclick = () => {
  if (assembled.length === 0) return;
  assembled.pop();
  status = null;
  render();
};

document.getElementById("reset-btn").onclick = () => newRound(wordIndex);

// ---------- Boot ----------
fetch("words.json")
  .then(r => r.json())
  .then(data => {
    WORDS = data;
    newRound(0);
  })
  .catch(err => {
    document.body.innerHTML =
      "<p style='color:red; padding:2rem;'>Could not load words.json. Make sure it's in the same folder as this page and that you're viewing this via a web server (e.g. GitHub Pages), not by double-clicking the file.</p>";
    console.error(err);
  });
</script>

</body>
</html>
